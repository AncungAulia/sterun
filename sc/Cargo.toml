[workspace]
resolver = "2"
members = [
  "contracts/*",
]

# Versi di-pin EXACT (`=`) supaya build reproducible dan wasm hash stabil.
# soroban-sdk = 26.1.1 (bukan 27/28): crate OpenZeppelin `stellar-*` 0.7.2
# (rilis terbaru per 2026-08-31) mensyaratkan `soroban-sdk ^26.1.0`, jadi
# workspace ini terkunci di protocol 26 sampai OZ merilis dukungan 27.
[workspace.dependencies]
soroban-sdk = "=26.1.1"
stellar-tokens = "=0.7.2"
stellar-access = "=0.7.2"
stellar-contract-utils = "=0.7.2"
stellar-macros = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
