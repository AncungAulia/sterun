# STE-6 (infra) — CI for the TypeScript side: be/, sdk/, fe/, landing-page/.
#
# Companion to contracts.yml, which owns everything under sc/. Split rather
# than merged because the two have nothing in common: different toolchains,
# different cache keys, and a Rust build that takes minutes should not sit in
# front of a lint error in a Next.js page.
#
# What this proves on every push: the workspace installs from the committed
# lockfile exactly, every package lints, every package's types check, every
# package builds, and the backend's and SDK's tests pass. Nothing here touches
# the network, so it cannot go red because testnet had a bad afternoon — the
# faucet's and the SDK's live behaviour is exercised by hand
# (`pnpm --filter @sterun/sdk e2e`) and written up in docs/deployments.md
# instead.
name: typescript

# docs/deployments.md is in this list on purpose and is easy to miss: the
# backend parses that file for its Stellar addresses, and its tests assert
# against it. Editing the deploy evidence can break `pnpm test`, so it has to
# be able to.
on:
  push:
    branches: ["**"]
    paths: &ts_paths
      - "be/**"
      - "sdk/**"
      - "fe/**"
      - "landing-page/**"
      # sdk/ vendors these (sdk/vendor/), and test/vendor.test.ts fails if the
      # copies drift, so a regenerate has to re-run this job.
      - "sc/bindings/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docs/deployments.md"
      - "docs/specs/vectors/**"
      # The deployment files are validated by this job too — see the step at the
      # bottom, and the bug that put it there.
      - "compose*.yml"
      - "be/Dockerfile"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths: *ts_paths
  workflow_dispatch:

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match `packageManager` in the root package.json. Installed with npm
  # rather than a third-party action so the pinned version is the only input.
  PNPM_VERSION: "10.12.4"
  NODE_VERSION: "24"

jobs:
  workspace:
    name: lint · typecheck · build · test
    runs-on: ubuntu-24.04

    # A real Postgres, not a mock. The PII vault's central claim is that the
    # stored bytes contain no plaintext, and the only way to check that is to
    # read bytes a database actually wrote. test/helpers/db.ts turns a missing
    # DATABASE_URL into a hard failure when CI is set, so this service going
    # away cannot quietly reduce the suite to the tests that do not matter.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sterun
          POSTGRES_PASSWORD: sterun
          POSTGRES_DB: sterun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sterun -d sterun"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      # package-manager-cache is off because it fires BEFORE pnpm exists: it
      # sees pnpm-lock.yaml, shells out to `pnpm store path`, and the job dies
      # with "Unable to locate executable file: pnpm". The cache step below does
      # the same work in the right order, and asks pnpm itself where its store
      # is rather than assuming a path that differs per OS.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm ${{ env.PNPM_VERSION }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm --version

      - name: Locate the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      # --frozen-lockfile: a dependency change that was not committed fails
      # here rather than silently resolving to something nobody reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://sterun:sterun@127.0.0.1:5432/sterun

      # STE-31. `docker compose ps` on the deployed host once failed outright
      # with "required variable TUNNEL_TOKEN is missing a value" — for a service
      # behind a profile that host would never start. Compose interpolates every
      # service regardless of profile, so a `${VAR:?}` on a profiled service is a
      # hard error for completely unrelated commands. Nothing caught it until it
      # was run on a real box.
      #
      # Each ingress profile is checked separately for exactly that reason: the
      # failure only appears when the file is parsed with that profile selected.
      - name: Validate the deployment compose files
        env:
          # A value, not the value. This step parses; it never starts anything.
          POSTGRES_PASSWORD: ci-validation-only
        run: |
          # env_file must exist to be parsed. Its contents are irrelevant here,
          # and it is gitignored, so this cannot leak into a commit.
          : > be/.env.production
          for args in \
            "-f compose.prod.yml" \
            "-f compose.prod.yml -f compose.homelab.yml" \
            "-f compose.prod.yml --profile caddy" \
            "-f compose.prod.yml --profile tunnel"; do
            echo "::group::docker compose $args config"
            docker compose $args config > /dev/null
            echo "::endgroup::"
          done
          rm -f be/.env.production
