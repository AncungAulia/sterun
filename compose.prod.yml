# STE-31 — the Sterun backend on a VPS.
#
# Five containers: Postgres, the API, the poller, the TTL keeper, and Caddy in
# front doing TLS. The three Node services are the SAME image with different
# commands, because that is what they are (be/CLAUDE.md).
#
#   cp be/.env.production.example be/.env.production   # then fill it in
#   docker compose -f compose.prod.yml up -d --build
#   curl https://<your domain>/health
#
# Full procedure, including DNS and the first-run checks: be/OPERATIONS.md,
# section "Deploy ke VPS".
#
# ## What makes this survive a reboot
#
# `restart: unless-stopped` on every service. Not `always`: a container the
# operator deliberately stopped should stay stopped through a reboot, otherwise
# taking something down for maintenance is undone by the next power cut.
#
# ## What is deliberately NOT here
#
# No CD pipeline, no replicas, no metrics stack. STE-31 says a documented manual
# deploy is enough for v1, and every one of those adds a moving part that would
# need its own runbook. The nonce store is already Postgres-backed (STE-31), so
# adding a second API replica later is a config change rather than a rewrite.

name: sterun

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sterun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sterun}
    volumes:
      # Named, unlike the development compose file. This one holds encrypted
      # identity documents and the indexer's materialised tables; losing it
      # means re-running `pnpm indexer rebuild` and losing the vault outright.
      - sterun-pgdata:/var/lib/postgresql/data
    # No `ports:`. Postgres is reachable only on the compose network — the one
    # line that stops a firewall mistake from putting the PII database on the
    # public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sterun} -d ${POSTGRES_DB:-sterun}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: be/Dockerfile
    image: sterun-backend:latest
    restart: unless-stopped
    env_file: [be/.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-sterun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sterun}
    depends_on:
      postgres: { condition: service_healthy }
    # Also no `ports:`. Caddy is the only thing that reaches it, so there is no
    # plaintext port on the box for anyone to find.
    expose: ["3001"]
    # Liveness, and only on the service that serves HTTP. It restarts a wedged
    # process; whether traffic should be routed here is /ready, which is the
    # proxy's question. Not in the Dockerfile: the poller and the keeper share
    # this image and serve nothing, so an image-level check marks them unhealthy
    # forever.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The poller. Fills the index the API serves; the API never fills it itself.
  indexer:
    image: sterun-backend:latest
    restart: unless-stopped
    env_file: [be/.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-sterun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sterun}
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started } # so migrations have run
    command: ["node", "dist/cli/indexer.js", "follow"]

  # Rent for the race records.
  #
  # `keeper run` is ONE-SHOT by design — its own header says "intended as a
  # weekly cron" — so it exits 0 the moment it finishes. This service used to
  # run it bare with `restart: unless-stopped`, which meant Docker restarted it
  # instantly, forever. Observed on the live box: 37 restarts, run #1766, a full
  # 42-key scan every few seconds, all of it hitting the PUBLIC testnet RPC. A
  # weekly job was running roughly a hundred thousand times a week.
  #
  # So the scheduling lives here, where the cadence is a deployment decision,
  # and the CLI stays the single-purpose thing it was written to be. The first
  # run happens immediately, so a deploy proves the keeper works instead of
  # proving it in seven days.
  #
  # A failed run does not kill the loop: rent that could not be paid this week
  # can be paid next week, and a container that exits here would go straight
  # back to the restart storm this comment exists to prevent.
  keeper:
    image: sterun-backend:latest
    restart: unless-stopped
    env_file: [be/.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-sterun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sterun}
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
    command:
      - sh
      - -c
      - |
        while true; do
          node dist/cli/keeper.js run || echo "keeper run failed; retrying after the interval"
          echo "keeper sleeping ${TTL_KEEPER_INTERVAL_SECONDS:-604800}s until the next run"
          sleep "${TTL_KEEPER_INTERVAL_SECONDS:-604800}"
        done

  # ---------------------------------------------------------------------------
  # Ingress. Pick ONE, by profile. Which one is right depends on the host, not
  # on preference:
  #
  #   caddy       the host's router forwards 80 and 443. Caddy gets a Let's
  #               Encrypt certificate over HTTP-01 and renews it itself.
  #                 docker compose -f compose.prod.yml --profile caddy up -d
  #
  #   cloudflared the host has NO port forwarding — a residential line, CGNAT,
  #               or an ISP that blocks 80/443. The tunnel dials OUT to
  #               Cloudflare, so nothing has to be reachable inbound, and
  #               Cloudflare terminates TLS and creates the DNS record.
  #                 docker compose -f compose.prod.yml --profile tunnel up -d
  #
  # The jameserver homelab is the second case: verified from the internet, port
  # 80 does not reach it even with something listening. Until the tunnel is
  # authenticated there, ingress is Tailscale Funnel on the Proxmox host —
  # see be/OPERATIONS.md.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Not `:?` — see the note on TUNNEL_TOKEN below.
      STERUN_DOMAIN: ${STERUN_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the ACME account key. Losing this volume means
      # re-issuing, and Let's Encrypt rate-limits that.
      - sterun-caddy-data:/data
      - sterun-caddy-config:/config
    depends_on: [api]

  # Cloudflare Tunnel. No published ports, by design: it dials OUT to Cloudflare
  # and traffic for the hostname comes back down that connection. That is what
  # makes it the right ingress for a host whose router forwards nothing.
  #
  # Locally-managed, not token-managed. The routing rules live in
  # deploy/cloudflared-config.yml, in this repository, where they can be
  # reviewed in a PR and rolled back with everything else — rather than in a
  # dashboard that `git log` cannot answer questions about.
  #
  # The credentials file is the secret and is NOT in the repo. It is written by
  # `cloudflared tunnel create` and its path is TUNNEL_CREDENTIALS_FILE.
  # Procedure: be/OPERATIONS.md, "Cloudflare Tunnel".
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./deploy/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      # `${VAR:-default}` rather than `${VAR:?}`: compose interpolates every
      # service regardless of profile, so a required variable on a profiled
      # service breaks EVERY command — even `docker compose ps` on a host that
      # will never run this profile. Learned by deploying it.
      - ${TUNNEL_CREDENTIALS_FILE:-./secrets/cloudflared-credentials.json}:/etc/cloudflared/credentials.json:ro
    depends_on: [api]

volumes:
  sterun-pgdata:
  sterun-caddy-data:
  sterun-caddy-config:
